version: 2
updates:
  # Action versions in .github/workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope

  # JSR and npm imports in the root deno.json.
  - package-ecosystem: deno
    directory: /
    schedule:
      interval: weekly
    groups:
      deno:
        patterns:
          - "*"
    commit-message:
      prefix: chore
      include: scope

  # Rust crates in the _wasm workspace. A crate update changes the generated
  # wasm, so run `deno task build:wasm` on the PR and commit the artifacts,
  # otherwise `build:wasm:check` fails.
  - package-ecosystem: cargo
    directory: /_wasm
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      # Pinned to the exact version that @deno/wasmbuild requires. Update it
      # together with @deno/wasmbuild.
      - dependency-name: wasm-bindgen
    commit-message:
      prefix: chore
      include: scope
